<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>מוצא מסלולי טיולים בישראל</title>
  <link rel="stylesheet" href="style.css?v=2.0.0" />
</head>
<body>
  <header>
    <h1>🥾 מוצא מסלולי טיולים בישראל</h1>
    <p>הקלידו שם של מקום בישראל וקבלו המלצות למסלולי הליכה בסביבה.</p>
  </header>

  <main>
    <form id="search-form" autocomplete="off">
      <input
        id="place-input"
        type="text"
        placeholder="לדוגמה: ירושלים, צפת, אילת..."
        required
      />
      <select id="min-rating">
        <option value="0">כל הדירוגים</option>
        <option value="4">⭐ 4.0 ומעלה</option>
        <option value="4.3">⭐ 4.3 ומעלה</option>
        <option value="4.5">⭐ 4.5 ומעלה</option>
      </select>
      <input id="max-distance" type="number" min="1" max="50" step="1" placeholder="מרחק מקסימלי מהמקום (ק״מ)" />
      <button type="submit">חיפוש מסלולים</button>
    </form>

    <section id="weather"></section>
    <p id="status"></p>
    <div id="results"></div>
    <section id="restaurants"></section>
  </main>

  <footer>
    המסלולים, הדירוגים והמסעדות מגיעים מ-Google Maps. בדקו תמיד את תנאי השטח, מזג האוויר ושעות הפתיחה לפני היציאה.
    <div class="version">גרסה 2.0.0</div>
  </footer>

  <!-- Site version (see CHANGELOG.md). Update it here: in the footer line above
       and in every ?v=... — the ?v= also makes browsers load the new files. -->
  <script src="config.js?v=2.0.0"></script>
  <script src="places.js?v=2.0.0"></script>
  <script src="app.js?v=2.0.0"></script>
</body>
</html>
